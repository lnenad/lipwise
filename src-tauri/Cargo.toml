[package]
name = "lipwise"
version = "0.1.0"
description = "Lipwise — voice dictation with an AI editor in the loop"
edition = "2021"
license = "MIT"
default-run = "lipwise"

[lib]
name = "lipwise_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
# Optional GPU backends for transcribe.cpp. CPU works everywhere; macOS always gets Metal.
vulkan = ["transcribe-cpp/vulkan"]
cuda = ["transcribe-cpp/cuda"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
cpal = "0.16"
rubato = "0.16"
enigo = "0.6"
arboard = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["time", "fs", "io-util", "sync"] }
sysinfo = { version = "0.38", default-features = false, features = ["system", "disk"] }
sha2 = "0.10"
hex = "0.4"
transcribe-cpp = { version = "0.3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
transcribe-cpp = { version = "0.3", default-features = false, features = ["metal"] }
# Microphone and Accessibility permission checks (permissions.rs).
objc2 = "0.6"
objc2-foundation = "0.3"
block2 = "0.6"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
hound = "3.5"
