name: build

# Tests and type-checks on every platform. Installers are built by release.yml.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    env:
      # Match release builds (tauri.conf.json minimumSystemVersion), which link differently
      # from builds targeting the runner's own macOS version. Ignored on other platforms.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libxdo-dev libssl-dev cmake

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # The C++ libraries' build output depends on this, but rust-cache doesn't hash it.
          key: macos-${{ env.MACOSX_DEPLOYMENT_TARGET }}

      - run: npm ci

      - name: Frontend type-check and build
        run: npm run build

      - name: Unit tests
        run: cargo test --lib
        working-directory: src-tauri

      # Links the full app, which the library tests alone don't.
      - name: Build the app
        run: cargo build
        working-directory: src-tauri
